schema_version = "1.3"

[task]
name = "jinwoo-sample/run-id-same-second-collision"
authors = [{ name = "Jinwoo (Ether)" }]
description = "같은 초 실행 시 run_id 충돌로 수집 데이터가 조용히 덮어써지는 장애 수정 (동시성 + 마이그레이션 + 시계 역행)"
keywords = ["concurrency", "sqlite", "data-integrity", "migration", "korean"]

[metadata]
difficulty = "medium"
category = "data-integrity"
tags = ["race-condition", "sqlite", "schema-migration", "clock-skew", "python"]
difficulty_explanation = """
버그 자체(초 단위 run_id 충돌)는 금방 보이지만, 세 가지를 동시에 만족해야 통과한다:
(1) 여러 프로세스가 동시에 collect 해도 고유 ID — 프로세스 내 카운터나 '같은 초 개수 세서 +1'은 경쟁 상태로 깨짐,
(2) '최신' 판정을 시각이 아닌 기록 순서로 — run_id/started_at 정렬은 시계 역행 테스트에서 깨짐,
(3) 운영 중인 구 스키마 DB를 데이터 손실 없이 이어 쓰기 — DB를 새로 만들면 보존 테스트에서 깨짐.
"""
calibration = "2026-10-07, 지시문만 제공·테스트 비공개, 모델별 2회: Claude Haiku 4.5 0/2, Claude Sonnet 5.5 2/2"
source = "실제 개인 프로젝트(x-metrics-pipeline, 2026-09)에서 고친 '같은 초 run_id 충돌' 버그를 바탕으로 재구성. 재시도·백업 cron·시계 역행 상황은 과제용 설정"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
